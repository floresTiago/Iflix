<h1>Lista de usuários</h1>
<a href="/">Lista de categorias</a>
<br>
<a href="/usuario">Novo Usuário</a>

@if( usuarios().length > 0 ){

    <ul>
        @for( usu of usuarios(); track usu.idUsuario ){
            <li>
                {{usu.nome}} => {{usu.idUsuario}}
                <a href="/usuario/{{usu.idUsuario}}">
                    editar
                </a>
                <button (click)="excluir(usu.idUsuario!)">
                    excluir
                </button>
            </li>
        }
    </ul>

}
@else{
    <h3>
        Nenhum usuário encontrado!
    </h3>
    <p>
        Cadastre um clicando aqui!
    </p>
}
